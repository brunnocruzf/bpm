# Nginx interno da API: todo request vai para public/index.php no PHP-FPM.
server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 25m;

  # DNS do Docker re-resolvido a cada 10s: recriar o container da API (novo IP) não deixa o proxy em 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $php_upstream api:9000;

  location ~ ^/(fpm-status|fpm-ping) { deny all; }

  location / {
    fastcgi_pass $php_upstream;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_read_timeout 60s;
  }
}
