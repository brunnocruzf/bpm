# Proxy de borda: único ponto exposto. /api → Laravel; o resto → SPA.
# Em ambientes remotos o HTTPS termina no ingress corporativo.
server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://api-web;
    # $http_host preserva a porta pública (URLs assinadas de download dependem disso)
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 60s;
  }

  # Nada do engine é roteado: o Flowable não é acessível pelo navegador.
  location /flowable-rest/ { return 404; }

  location / {
    proxy_pass http://web;
    proxy_set_header Host $host;
  }
}
