openapi: 3.1.0
info:
  title: BPM TMSA — API de produto
  version: 0.2.0
  description: |
    API pública do BPM TMSA (Laravel). Única superfície exposta: o Flowable REST fica em rede interna
    e é acessado apenas pelo backend/worker. Erros seguem RFC 7807 (application/problem+json) com
    `correlationId`. Mutações críticas aceitam `Idempotency-Key` (obrigatória em POST /process-instances).
    Autorização no servidor por permissões (Gates): settings.manage, processes.manage, audit.read, audit.export,
    reports.instance, reports.operational, reports.templates, data.sensitive. Segredos nunca são devolvidos.
servers:
  - url: /api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Access token do Microsoft Entra ID (scope access_as_user); sessão SuperAdmin "bpmsa_..." emitida por
        POST /auth/superadmin/login; visitante (somente fora de produção) "dev:<username>" de usuário fictício. Ver ADR-0015.
  parameters:
    FlowKey: { name: key, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' } }
    Version: { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
    StageKey: { name: stageKey, in: path, required: true, schema: { type: string } }
    FormKey: { name: formKey, in: path, required: true, schema: { type: string } }
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, pattern: '^[A-Za-z0-9\-_:.]{8,160}$' } }
    CorrelationId: { name: X-Correlation-Id, in: header, required: false, schema: { type: string } }
  responses:
    Problem:
      description: Erro (RFC 7807)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Branding:
      type: object
      properties:
        appName: { type: string }
        orgName: { type: string }
        tagline: { type: string }
        colors: { type: object, properties: { primary: { type: string }, secondary: { type: string }, accent: { type: string } } }
        assets: { type: object, properties: { main: { type: [string, 'null'] }, compact: { type: [string, 'null'] }, favicon: { type: [string, 'null'] } } }
        links: { type: object, description: Links institucionais da tela de login (https:// ou mailto:), properties: { support: { type: [string, 'null'] }, privacy: { type: [string, 'null'] }, help: { type: [string, 'null'] } } }
        version: { type: integer }
    AuthConfig:
      type: object
      properties:
        driver: { type: string, description: Legado (dev habilita o visitante) }
        source: { type: string, enum: [settings, environment] }
        entra: { type: [object, 'null'], description: "Parâmetros públicos do MSAL da configuração ATIVADA (null = variáveis do build)" }
        methods:
          type: object
          properties:
            entra: { type: boolean }
            demo: { type: boolean, description: Visitante com usuários fictícios (nunca em produção) }
            demoUrl: { type: [string, 'null'], description: Ambiente de demonstração separado }
            superadmin: { type: boolean, description: Habilitado e permitido para o IP desta requisição }
    SuperAdminLogin:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 120 }
        password: { type: string, format: password, maxLength: 256 }
    SuperAdminSession:
      type: object
      properties:
        token: { type: string, description: Token opaco (somente o hash fica no servidor). Enviar como Bearer. }
        expiresAt: { type: string, format: date-time }
        idleMinutes: { type: integer }
        user: { type: object, properties: { name: { type: string }, username: { type: string } } }
    Setting:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        status: { type: string, enum: [configured, incomplete, test_pending, error, disabled] }
        statusDetail: { type: [string, 'null'] }
        version: { type: integer }
        value: { type: object, description: Valores não secretos; segredos aparecem apenas como metadados (configured/source/updatedAt) }
        updatedAt: { type: [string, 'null'], format: date-time }
        updatedBy: { type: [string, 'null'] }
        lastValidation: { type: [object, 'null'] }
        lastValidatedAt: { type: [string, 'null'], format: date-time }
        activatedAt: { type: [string, 'null'], format: date-time }
    ReportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        format: { type: string, enum: [pdf, csv, xlsx] }
        status: { type: string, enum: [queued, rendering, ready, failed, expired] }
        progress: { type: integer }
        errorCode: { type: [string, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, examples: [validation_failed, forbidden, not_found, stale_task, task_unavailable, idempotency_key_reused, deploy_pending, integration_unavailable] }
        instance: { type: string }
        correlationId: { type: string }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
        problems: { type: array, items: { $ref: '#/components/schemas/ValidationProblem' } }
    ValidationProblem:
      type: object
      properties:
        severity: { type: string, enum: [error, warning, info] }
        code: { type: string }
        message: { type: string }
        stageKey: { type: [string, 'null'] }
    Condition:
      type: object
      description: DSL em lista branca, compilada para funções seguras do Flowable (vars:equals, vars:isEmpty...).
      properties:
        match: { type: string, enum: [all, any] }
        rules:
          type: array
          maxItems: 10
          items:
            type: object
            required: [field, operator]
            properties:
              field: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,62}$' }
              operator: { type: string, enum: [eq, neq, empty, not_empty, contains, gt, gte, lt, lte] }
              value: { type: [string, number, boolean, 'null'] }
    Stage:
      type: object
      properties:
        key: { type: string }
        elementId: { type: string }
        name: { type: string }
        type: { type: string, enum: [start, user_task, exclusive_gateway, parallel_gateway, service_task, timer, end] }
        lane: { type: [string, 'null'], description: Chave do grupo/raia (bpm_groups) }
        config: { type: object }
        form: { type: [object, 'null'], properties: { formKey: { type: string }, title: { type: string }, fieldCount: { type: integer } } }
        outgoing:
          type: array
          items:
            type: object
            properties:
              target: { type: string }
              condition: { $ref: '#/components/schemas/Condition' }
              conditionText: { type: string }
              isDefault: { type: boolean }
    Version:
      type: object
      properties:
        version: { type: integer }
        status: { type: string, enum: [draft, published, retired, suspended] }
        lockVersion: { type: integer }
        hash: { type: [string, 'null'] }
        engineDeployed: { type: boolean }
        stages: { type: array, items: { $ref: '#/components/schemas/Stage' } }
        openingStageKey: { type: [string, 'null'] }
    InstanceSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: ['IRR-000001/26'] }
        requesterName: { type: string }
        requesterArea: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
        status: { type: string, enum: [starting, running, completed, cancelled, error] }
        result: { type: [string, 'null'] }
        processing: { type: boolean, description: Comando ao engine ainda não confirmado }
        currentTasks: { type: array, items: { type: object } }
    TaskSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [open, claimed, completing, completed, cancelled] }
        candidateGroup: { type: [string, 'null'] }
        dueAt: { type: [string, 'null'], format: date-time }
        rowVersion: { type: integer, description: ETag para concorrência otimista }
        canWork: { type: boolean }
        canClaim: { type: boolean }
paths:
  /health:
    get: { summary: "Liveness, security: []", responses: { '200': { description: OK } } }
  /ready:
    get: { summary: "Readiness (banco + engine), security: []", responses: { '200': { description: OK }, '503': { description: Degradado } } }
  /dev/users:
    get: { security: [], summary: "Perfis fictícios do acesso de visitante (404 com a demonstração desabilitada e sempre em produção)", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Problem' } } }
  /me:
    get: { summary: "Usuário atual, papéis, grupos, permissões, foto (photo.version | null) e método do login (auth.method: entra | demo | superadmin)", responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Problem' } } }
  /me/photo:
    get: { summary: "Foto do próprio usuário importada do Entra ID (image/webp; ETag; 404 sem foto ou recurso desligado)", responses: { '200': { description: OK }, '304': { description: Not Modified }, '404': { $ref: '#/components/responses/Problem' } } }
  /admin/managed-users/{id}/photo:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get: { summary: "Foto de um usuário (settings.manage)", responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Problem' }, '404': { $ref: '#/components/responses/Problem' } } }
  /admin/managed-users/{id}/photo/refresh:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { summary: "Solicita a atualização da foto (job; somente contas Entra; settings.manage)", responses: { '202': { description: Accepted }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } } }
  /auth/superadmin/login:
    post:
      security: []
      summary: "Login SuperAdmin (acesso de emergência): usuário e senha locais; resposta genérica, limite de tentativas e bloqueio"
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SuperAdminLogin' } } } }
      responses:
        '200': { description: Sessão criada, content: { application/json: { schema: { $ref: '#/components/schemas/SuperAdminSession' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { description: Método desabilitado neste ambiente ou IP não permitido }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post: { summary: "Saída auditada; revoga a sessão SuperAdmin atual", responses: { '204': { description: Sem conteúdo }, '401': { $ref: '#/components/responses/Problem' } } }
  /meta:
    get: { summary: "Grupos, categorias, catálogo de campos automáticos, consultas AX, integrações e operadores", responses: { '200': { description: OK } } }
  /catalog/processes:
    get:
      summary: Catálogo permitido ao usuário
      parameters: [{ name: category, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /flows:
    post:
      summary: Cria fluxo + versão 1 rascunho + "Etapa 1" + formulário vazio associado + Início→Etapa 1→Fim (transacional)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string, minLength: 3, maxLength: 90 }
                key: { type: [string, 'null'] }
                category: { type: string }
                description: { type: [string, 'null'] }
                instancePrefix: { type: [string, 'null'] }
      responses: { '201': { description: Criado }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /flows/{key}:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }]
    get: { summary: "Fluxo e versões", responses: { '200': { description: OK } } }
    patch: { summary: "Atualiza nome/categoria/descrição/prefixo/grupos iniciadores", responses: { '200': { description: OK } } }
    delete:
      summary: "Exclui fluxo NUNCA publicado (só rascunho, sem solicitações); confirmação ?confirm=<identificador>. Publicado → 409 flow_published"
      parameters: [{ name: confirm, in: query, required: true, schema: { type: string } }]
      responses: { '204': { description: Excluído }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /flows/{key}/start-form:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }]
    get: { summary: "Formulário de abertura da versão publicada (com pré-preenchimento do servidor)", responses: { '200': { description: OK } } }
  /flows/{key}/submissions:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }]
    get: { summary: "Resultados/respostas filtradas por autorização", responses: { '200': { description: OK } } }
  /definitions/{key}/versions:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }]
    get: { summary: "Versões", responses: { '200': { description: OK } } }
    post: { summary: "Novo rascunho clonado da última versão (publicadas são imutáveis)", responses: { '201': { description: Criado } } }
  /definitions/{key}/versions/{version}:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }, { $ref: '#/components/parameters/Version' }]
    get: { summary: "Versão com etapas, rotas, campos e validação", responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Version' } } } } } }
    delete: { summary: "Descarta o rascunho de um fluxo já publicado (versões publicadas são imutáveis → 409 not_draft)", responses: { '204': { description: Descartado }, '409': { $ref: '#/components/responses/Problem' } } }
  /definitions/{key}/versions/{version}/stages:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }, { $ref: '#/components/parameters/Version' }]
    post: { summary: "Adiciona etapa (tarefa humana já com formulário; decisão/integração/timer/fim sem formulário)", responses: { '201': { description: Criado }, '409': { $ref: '#/components/responses/Problem' } } }
  /definitions/{key}/versions/{version}/stages/{stageKey}:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/StageKey' }]
    patch: { summary: "Atualiza nome, tipo, raia, instrução ou configuração", responses: { '200': { description: OK } } }
    delete: { summary: "Remove etapa (reconecta predecessores; mantém ao menos uma tarefa humana)", responses: { '200': { description: OK } } }
  /definitions/{key}/versions/{version}/stages-order:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }, { $ref: '#/components/parameters/Version' }]
    put: { summary: "Reordenação visual", responses: { '200': { description: OK } } }
  /definitions/{key}/versions/{version}/stages/{stageKey}/transitions:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/StageKey' }]
    put:
      summary: Define "O que ocorre depois?" (condições em DSL; nada de expressão livre)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transitions:
                  type: array
                  items: { type: object, properties: { target: { type: string }, condition: { $ref: '#/components/schemas/Condition' }, isDefault: { type: boolean }, label: { type: string } } }
      responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Problem' } }
  /definitions/{key}/versions/{version}/forms/{formKey}:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/FormKey' }]
    get: { summary: "Schema Form.io (sem credenciais/URLs administrativas)", responses: { '200': { description: OK } } }
    put: { summary: "Salva schema (somente rascunho; sanitizado - sem JS livre, fontes externas ou HTML perigoso)", responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } } }
  /definitions/{key}/versions/{version}/forms/{formKey}/copy-from:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }, { $ref: '#/components/parameters/Version' }, { $ref: '#/components/parameters/FormKey' }]
    post: { summary: "Usar outro formulário como modelo (cópia independente)", responses: { '200': { description: OK } } }
  /definitions/{key}/versions/{version}/bpmn:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }, { $ref: '#/components/parameters/Version' }]
    get: { summary: "BPMN 2.0 XML (gerado para rascunho; congelado para publicada)", responses: { '200': { description: OK, content: { application/xml: {} } } } }
  /definitions/{key}/versions/{version}/bpmn/import:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }, { $ref: '#/components/parameters/Version' }]
    post: { summary: "Importa BPMN (subset suportado; preserva formulários por element_id)", responses: { '200': { description: OK }, '422': { $ref: '#/components/responses/Problem' } } }
  /definitions/{key}/versions/{version}/validate:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }, { $ref: '#/components/parameters/Version' }]
    post: { summary: "Valida etapas, formulários, rotas, campos, papéis, timers e integrações", responses: { '200': { description: OK } } }
  /definitions/{key}/versions/{version}/publish:
    parameters: [{ $ref: '#/components/parameters/FlowKey' }, { $ref: '#/components/parameters/Version' }]
    post: { summary: "Publica (Bpm.Publisher); congela artefatos e agenda deploy via outbox", responses: { '202': { description: Aceito }, '422': { $ref: '#/components/responses/Problem' } } }
  /process-instances:
    get:
      summary: Grid de solicitações visível ao usuário
      parameters: [{ name: flow, in: query, schema: { type: string } }, { name: status, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string } }, { name: page, in: query, schema: { type: integer } }]
      responses: { '200': { description: OK } }
    post:
      summary: Abre solicitação (submissão de abertura + START no outbox, mesma transação)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [flowKey, data], properties: { flowKey: { type: string }, data: { type: object } } }
      responses:
        '202': { description: Aceito; processando no engine, content: { application/json: { schema: { type: object, properties: { instance: { $ref: '#/components/schemas/InstanceSummary' } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /process-instances/metrics:
    get: { summary: "Indicadores (em andamento, aguardando, concluídas no mês, % no prazo)", responses: { '200': { description: OK } } }
  /process-instances/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: "Detalhe com tarefas, respostas, anexos, plano de ação e diagrama", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Problem' } } }
  /process-instances/{id}/timeline:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: "Linha do tempo filtrada", responses: { '200': { description: OK } } }
  /submissions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: "Submissão com schema da época (somente leitura)", responses: { '200': { description: OK } } }
  /tasks:
    get:
      summary: Inbox
      parameters: [{ name: scope, in: query, schema: { type: string, enum: [mine, groups, started, completed] } }]
      responses: { '200': { description: OK } }
  /tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: "Tarefa com formulário, pré-preenchimento, rascunho e plano de ação", responses: { '200': { description: OK } } }
  /tasks/{id}/claim:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post: { summary: "Assume a tarefa", responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Problem' } } }
  /tasks/{id}/release:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post: { summary: "Devolve ao grupo", responses: { '200': { description: OK } } }
  /tasks/{id}/reassign:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post: { summary: "Reatribui (Bpm.Admin) com justificativa auditada", responses: { '200': { description: OK } } }
  /tasks/{id}/draft:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put: { summary: "Salva rascunho (não validado)", responses: { '200': { description: OK } } }
  /tasks/{id}/complete:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }, { name: If-Match, in: header, schema: { type: string } }]
    post:
      summary: Conclui (valida atribuição, rowVersion e payload; grava submissão + auditoria + COMPLETE no outbox)
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [data], properties: { data: { type: object }, rowVersion: { type: integer } } }
      responses: { '202': { description: Aceito; processando }, '403': { $ref: '#/components/responses/Problem' }, '409': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' }, '503': { $ref: '#/components/responses/Problem' } }
  /tasks/{id}/actions/{actionId}/complete:
    parameters: [{ $ref: '#/components/parameters/Id' }, { name: actionId, in: path, required: true, schema: { type: string, format: uuid } }]
    post: { summary: "Conclui uma ação do plano (30.1) com observações e evidências", responses: { '200': { description: OK } } }
  /attachments:
    post:
      summary: Upload (extensão, MIME real, tamanho e antivírus validados)
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, taskId: { type: string, format: uuid }, fieldKey: { type: string } } }
      responses: { '201': { description: Criado }, '422': { $ref: '#/components/responses/Problem' } }
  /attachments/{id}/url:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get: { summary: "URL assinada de curta duração (após autorização)", responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Problem' } } }
  /lookups/{source}:
    get:
      summary: Consulta AX sob demanda (tpr, item, purchaseOrder, supplier)
      parameters: [{ name: source, in: path, required: true, schema: { type: string } }, { name: value, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '503': { $ref: '#/components/responses/Problem' } }
  /admin/managed-users:
    get:
      summary: "Lista identidades (settings.manage); filtros no servidor"
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: source, in: query, schema: { type: string, enum: [entra, local, demo, superadmin] } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: category, in: query, schema: { type: string, enum: [supplier, customer, internal, none] } }
        - { name: attention, in: query, schema: { type: string, enum: [entra_disabled, guest, login_only, manager_pending, invitation_pending, invitation_expired, locked] } }
        - { name: area, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: group, in: query, schema: { type: string } }
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
