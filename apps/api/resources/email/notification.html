<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{d.preheader}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f4f7;">
  <div style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;overflow:hidden;mso-hide:all;">{d.preheader}</div>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;background-color:#f1f4f7;border-collapse:collapse;">
    <tr>
      <td align="center" style="padding:34px 14px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="620" style="width:100%;max-width:620px;border-collapse:separate;border-spacing:0;">
          <tr>
            <td bgcolor="#ffffff" style="padding:18px 25px;background-color:#ffffff;border:1px solid #dfe6ed;border-bottom:0;border-radius:12px 12px 0 0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;">
                <tr>
                  <td valign="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.2;font-weight:700;letter-spacing:.2px;color:#172230;">{d.logoHtml:html}</td>
                  <td align="right" valign="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.4;color:#64748b;">
                    <strong style="font-size:14px;color:#172230;">{d.headerTitle}</strong><br>{d.orgName}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr><td bgcolor="{d.accentColor}" height="4" style="height:4px;line-height:4px;font-size:0;background-color:{d.accentColor};">&nbsp;</td></tr>
          <tr>
            <td bgcolor="#ffffff" style="padding:32px 34px 30px;background-color:#ffffff;border:1px solid #dfe6ed;border-top:0;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;">
                <tr>
                  <td style="padding:0 0 11px;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.4;font-weight:700;letter-spacing:1.15px;text-transform:uppercase;color:{d.accentColor};">{d.eyebrow}</td>
                </tr>
                <tr>
                  <td style="padding:0 0 17px;font-family:Arial,Helvetica,sans-serif;font-size:25px;line-height:1.28;font-weight:700;color:#172230;">{d.headline}</td>
                </tr>
                <tr>
                  <td style="padding:0 0 22px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.65;color:#334155;">{d.contentHtml:html}</td>
                </tr>
                <tr>
                  <td align="left" style="padding:2px 0 0;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;border-spacing:0;">
                      <tr>
                        <td align="center" bgcolor="{d.accentColor}" style="background-color:{d.accentColor};border-radius:7px;">
                          <a href="{d.actionUrl}" style="display:inline-block;padding:13px 21px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.2;font-weight:700;color:{d.accentTextColor};text-decoration:none;">{d.actionLabel}</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding:24px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#64748b;">{d.linkHelpText}<br><a href="{d.actionUrl}" style="color:#245b8f;word-break:break-all;">{d.actionUrl}</a></td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 16px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.55;color:#64748b;text-align:center;">
              <strong style="font-weight:600;color:#475569;">{d.orgName}</strong><br>
              {d.footerText}<br>
              <span style="font-size:11px;color:#94a3b8;">© {d.year} · BPM TMSA</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
