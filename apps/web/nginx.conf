server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Cabeçalhos de segurança são repetidos em cada location: add_header numa location
  # anula os herdados do bloco server (comportamento do Nginx).
  # CSP: scripts somente da própria origem (sem inline). 'unsafe-eval' é exigido pelo Form.io
  # (compila templates em runtime); o JS do designer é removido no servidor e o renderer usa noeval.
  # Form.io e PrimeVue usam estilos inline.
  # connect-src/frame-src incluem o Entra ID (MSAL); frame-src 'self' blob: exibe o PDF de relatório baixado pela API.
  # O Microsoft Graph NUNCA é chamado pelo browser (sincronização é exclusiva do backend).
  set $csp "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://login.microsoftonline.com; frame-src 'self' blob: https://login.microsoftonline.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy $csp always;
    try_files $uri $uri/ /index.html;
  }
}
